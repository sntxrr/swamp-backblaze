manifestVersion: 1

name: "@sntxrr/b2-hygiene"
version: "2026.08.05.1"
description: "Audit a scanned Backblaze B2 account for hidden-version retention gaps, over-scoped or orphaned application keys, and public buckets. Read-only — it analyses the resources b2-account's scan already wrote and never calls B2."
