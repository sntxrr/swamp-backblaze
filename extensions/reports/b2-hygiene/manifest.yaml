manifestVersion: 1

name: "@sntxrr/b2-hygiene"
version: "2026.08.06.1"
description: "Audit a scanned Backblaze B2 account for hidden-version retention gaps, over-scoped or orphaned application keys, and public buckets. Two reports: a method-scope audit of one b2-account scan, and a workflow-scope companion that joins those findings to @sntxrr/b2/files byte totals so each gap is ranked by what fixing it recovers. Read-only — both analyse resources already written and never call B2."
repository: "https://github.com/sntxrr/swamp-backblaze"

paths:
  base: manifest

reports:
  - b2_hygiene.ts
  - b2_fleet_hygiene.ts

additionalFiles:
  - README.md
  - LICENSE.md

labels:
  - backblaze
  - b2
  - audit
  - security
  - cost
  - restic
